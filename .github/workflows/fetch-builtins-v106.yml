name: Fetch Protein Lab built-ins v1.0.6

on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  fetch-builtins:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate curated RCSB structures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builtins
          ids=(1CRN 1UBQ 1MBN 4HHB 1LYZ 1L2Y 1VII 1AKE 1BRS 2PTC 1ATP 1F88 1TIM)
          for id in "${ids[@]}"; do
            echo "Fetching $id"
            url="https://files.rcsb.org/download/${id}.pdb"
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --max-time 180 \
              -A 'ProteinLab/1.0.6 (+https://github.com/build33Mercury/ProteinLab)' \
              "$url" -o "builtins/${id}.pdb"
            test -s "builtins/${id}.pdb"
            grep -Eq '^(ATOM  |HETATM)' "builtins/${id}.pdb"
            bytes=$(wc -c < "builtins/${id}.pdb")
            if [ "$bytes" -lt 256 ]; then
              echo "$id payload too small" >&2
              exit 1
            fi
            sha256sum "builtins/${id}.pdb"
          done
          printf '%s\n' "${ids[@]}" > builtins/BUILTIN_IDS.txt
          (cd builtins && sha256sum *.pdb > SHA256SUMS.txt)

      - name: Upload validated built-in bank
        uses: actions/upload-artifact@v4
        with:
          name: ProteinLab-v1.0.6-builtins
          path: builtins/
          if-no-files-found: error
          retention-days: 1
